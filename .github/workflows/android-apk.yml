name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "APK version name"
        required: false
        default: "0.1.0"
  push:
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug -PappVersion="${{ steps.version.outputs.version }}"

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist/packages
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/packages/DeskAccess-${{ steps.version.outputs.version }}-android-debug.apk"
          (cd dist/packages && sha256sum "DeskAccess-${{ steps.version.outputs.version }}-android-debug.apk" > SHA256SUMS-android.txt)

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskAccess-android-debug
          path: |
            dist/packages/DeskAccess-${{ steps.version.outputs.version }}-android-debug.apk
            dist/packages/SHA256SUMS-android.txt
          if-no-files-found: error

  release:
    name: Publish Android release asset
    if: github.ref_type == 'tag'
    needs: [android]
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        shell: bash
        run: |
          mkdir -p upload
          find release-assets -type f \( -name "*.apk" -o -name "SHA256SUMS-android.txt" \) -exec cp {} upload/ \;
          ls -lh upload

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
